<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam Detection</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:15px/1.6 "Helvetica Neue",Helvetica,Arial,sans-serif;background:#ECEAE4;color:#141414;max-width:68rem;margin:0 auto;padding:3rem 1.5rem 4rem}
.eyebrow{font:11px/1 ui-monospace,"SF Mono","Courier New",monospace;letter-spacing:.18em;text-transform:uppercase;color:#B04324;margin-bottom:1.4rem}
h1{font-size:clamp(2.4rem,6vw,4.25rem);font-weight:700;letter-spacing:-.04em;line-height:.95;margin-bottom:1.5rem}
.lede{color:#57544E;max-width:34rem;margin-bottom:2rem}
button{display:inline-block;border:1px solid #141414;background:transparent;color:#141414;font:11px/1 ui-monospace,"SF Mono","Courier New",monospace;letter-spacing:.15em;text-transform:uppercase;padding:.85rem 1.5rem;cursor:pointer}
button:hover{background:#141414;color:#ECEAE4}
#stage{position:relative;border:1px solid #D5D1C8;background:#F5F3EE;min-height:14rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage canvas{display:block;width:100%;height:auto}
.placeholder{color:#8B877E;padding:5rem 1rem;font-size:14px}
#status{margin-top:1rem;font:11px/1.6 ui-monospace,"SF Mono","Courier New",monospace;letter-spacing:.12em;text-transform:uppercase;color:#57544E}
</style>
</head>
<body>
<p class="eyebrow">02 &mdash; Live Webcam</p>
<h1>Start the camera.<br>Watch it think.</h1>
<p class="lede">Only frames that complete inference are shown. Boxes appear when the model finds objects.</p>
<button id="toggle">Start camera</button>
<div id="stage"><p class="placeholder">Camera is off.</p></div>
<p id="status">Idle.</p>

<script>
const toggleBtn = document.getElementById('toggle');
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
let running = false, busy = false, stream = null;
let video, display;
let srcCount = 0, infCount = 0, lastDets = 0, lastMs = 0;

// ponytail: fixed tick + in-flight guard instead of a frame queue
setInterval(loop, 100);
setInterval(meter, 1000);

toggleBtn.addEventListener('click', async () => {
  if (running) {
    stop();
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1280}}});
  } catch (e) {
    statusEl.textContent = 'Could not access camera: ' + e.message;
    return;
  }
  stage.innerHTML = '';
  video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.style.display = 'none';
  video.srcObject = stream;
  stage.appendChild(video);
  await video.play();
  const scale = 640 / Math.max(video.videoWidth, video.videoHeight);
  display = document.createElement('canvas');
  display.id = 'display';
  display.width = Math.round(video.videoWidth * scale);
  display.height = Math.round(video.videoHeight * scale);
  stage.appendChild(display);
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(countSrc);
  running = true;
  toggleBtn.textContent = 'Stop camera';
  statusEl.textContent = 'Waiting for first inference...';
});

function countSrc() {
  srcCount++;
  if (running) video.requestVideoFrameCallback(countSrc);
}

function stop() {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  toggleBtn.textContent = 'Start camera';
  statusEl.textContent = 'Idle.';
}

async function loop() {
  if (!running || busy || video.readyState < 2) return;
  busy = true;
  try {
    const cap = document.createElement('canvas');
    cap.width = display.width;
    cap.height = display.height;
    cap.getContext('2d').drawImage(video, 0, 0, cap.width, cap.height);
    if (!video.requestVideoFrameCallback) srcCount++;
    const blob = await new Promise(r => cap.toBlob(r, 'image/jpeg', 0.7));
    const t0 = performance.now();
    const res = await fetch('/detect', {method: 'POST', body: blob});
    if (!res.ok) throw new Error(await res.text());
    const dets = await res.json();
    infCount++;
    lastMs = Math.round(performance.now() - t0);
    lastDets = dets.length;
    const ctx = display.getContext('2d');
    ctx.drawImage(cap, 0, 0, display.width, display.height);
    boxes(ctx, dets);
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    busy = false;
  }
}

function meter() {
  if (!running) return;
  statusEl.textContent = infCount + '/' + srcCount + ' fps | ' + lastMs + ' ms | ' + lastDets + ' object(s)';
  infCount = 0;
  srcCount = 0;
}

function boxes(ctx, dets) {
  ctx.lineWidth = 2;
  ctx.font = '13px ui-monospace, "Courier New", monospace';
  for (const d of dets) {
    const [x1, y1, x2, y2] = d.box;
    ctx.strokeStyle = '#141414';
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const label = d.cls + ' ' + d.conf.toFixed(2);
    const w = ctx.measureText(label).width + 12;
    ctx.fillStyle = '#F5F3EE';
    ctx.fillRect(x1, y1 - 20, w, 20);
    ctx.strokeRect(x1, y1 - 20, w, 20);
    ctx.fillStyle = '#141414';
    ctx.fillText(label, x1 + 6, y1 - 6);
  }
}
</script>
</body>
</html>
